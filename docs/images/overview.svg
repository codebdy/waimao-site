<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d">
<title id="t">外贸网站制作技能能力全景</title>
<desc id="d">左侧是你需要提供的公司介绍、产品资料、Logo 和照片、目标市场，流入中央的 AI 外贸网站制作技能，再流向右侧八项能力：多语言外贸网站、B2B 专业设计、站内技术 SEO、询盘与客户联系、Cookie 与访问统计、免费发布上线、自己的域名加 SSL、随时更新内容。底部为可选增值服务。</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F8FBFF"/><stop offset="1" stop-color="#EEF3FF"/>
  </linearGradient>
  <radialGradient id="blobA" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#67E8F9" stop-opacity=".45"/><stop offset="1" stop-color="#67E8F9" stop-opacity="0"/></radialGradient>
  <radialGradient id="blobB" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#A78BFA" stop-opacity=".40"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient>
  <radialGradient id="blobC" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#93C5FD" stop-opacity=".45"/><stop offset="1" stop-color="#93C5FD" stop-opacity="0"/></radialGradient>
  <radialGradient id="orb" cx="0.35" cy="0.3" r="0.8">
    <stop offset="0" stop-color="#38BDF8"/><stop offset=".55" stop-color="#2563EB"/><stop offset="1" stop-color="#6D28D9"/>
  </radialGradient>
  <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5"><stop offset=".55" stop-color="#60A5FA" stop-opacity=".35"/><stop offset="1" stop-color="#60A5FA" stop-opacity="0"/></radialGradient>
  <linearGradient id="inLine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#14B8A6"/><stop offset="1" stop-color="#3B82F6"/></linearGradient>
  <linearGradient id="outLine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
  <linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0891B2"/><stop offset=".5" stop-color="#2563EB"/><stop offset="1" stop-color="#7C3AED"/></linearGradient>
  <filter id="shadow" x="-20%" y="-40%" width="140%" height="190%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="6"/><feOffset dy="4" result="b"/>
    <feComponentTransfer><feFuncA type="linear" slope=".14"/></feComponentTransfer>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#C7D2FE" opacity=".55"/></pattern>
</defs>
<style>
  text { font-family: 'PingFang SC','Microsoft YaHei','Noto Sans SC','Source Han Sans SC',sans-serif; }
  .base { fill: none; stroke-width: 2; opacity: .55; }
  /* One calm signal per 5s cycle: inputs -> orb pulse -> outputs -> cards light up. */
  .sig { fill: none; stroke-linecap: round; stroke-width: 4; stroke-dasharray: 14 120; stroke-dashoffset: 14; opacity: 0; }
  .sig-in { animation: sigIn 5s ease-in-out infinite; }
  .sig-out { animation: sigOut 5s ease-in-out infinite; }
  .halo { opacity: .6; animation: pulse 5s ease-in-out infinite; }
  .chip { stroke-opacity: 0; animation: glow 5s ease-in-out infinite; }
  @keyframes sigIn { 0% { stroke-dashoffset: 14; opacity: 0; } 3% { opacity: 1; } 30% { stroke-dashoffset: -100; opacity: 1; } 32%,100% { stroke-dashoffset: -100; opacity: 0; } }
  @keyframes sigOut { 0%,36% { stroke-dashoffset: 14; opacity: 0; } 39% { opacity: 1; } 68% { stroke-dashoffset: -100; opacity: 1; } 70%,100% { stroke-dashoffset: -100; opacity: 0; } }
  @keyframes pulse { 0%,26%,52%,100% { opacity: .6; } 34% { opacity: 1; } }
  @keyframes glow { 0%,66%,96%,100% { stroke-opacity: 0; } 74%,86% { stroke-opacity: .85; } }
  @media (prefers-reduced-motion: reduce) { .sig-in,.sig-out,.halo,.chip { animation: none; } }
</style>
