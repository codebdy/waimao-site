<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-labelledby="t d">
<title id="t">新手起步路线图</title>
<desc id="d">从安装 skill 到被 Google 收录的七个步骤：安装 skill、告诉 AI 资料、电脑上预览，上传 GitHub、发布到 Cloudflare、绑定域名（可选），开启收录并提交 Google。</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8FBFF"/><stop offset="1" stop-color="#EEF3FF"/></linearGradient>
  <radialGradient id="blobA" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#67E8F9" stop-opacity=".40"/><stop offset="1" stop-color="#67E8F9" stop-opacity="0"/></radialGradient>
  <radialGradient id="blobB" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#A78BFA" stop-opacity=".35"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#14B8A6"/><stop offset=".5" stop-color="#3B82F6"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
  <linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0891B2"/><stop offset=".5" stop-color="#2563EB"/><stop offset="1" stop-color="#7C3AED"/></linearGradient>
  <filter id="shadow" x="-20%" y="-40%" width="140%" height="190%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="6"/><feOffset dy="4"/>
    <feComponentTransfer><feFuncA type="linear" slope=".13"/></feComponentTransfer>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#C7D2FE" opacity=".55"/></pattern>
</defs>
<style>
  text { font-family: 'PingFang SC','Microsoft YaHei','Noto Sans SC','Source Han Sans SC','Segoe UI','Noto Sans Arabic',sans-serif; }
  .base { fill: none; stroke-width: 2; opacity: .55; }
  .sig { fill: none; stroke-linecap: round; stroke-width: 4; stroke-dasharray: 14 120; stroke-dashoffset: 14; opacity: 0; }
  .glow { stroke-opacity: 0; }
  .road {{ animation: road 8s ease-in-out infinite; }}
  @keyframes road {{ 0% {{ stroke-dashoffset: 14; opacity: 0; }} 3% {{ opacity: 1; }} 80% {{ stroke-dashoffset: -100; opacity: 1; }} 84%,100% {{ stroke-dashoffset: -100; opacity: 0; }} }}
  .r0 { animation: r0 8s ease-in-out infinite; }
  @keyframes r0 { 0%,0%,24%,100% { stroke-opacity: 0; } 6%,16% { stroke-opacity: .85; } }
  .r1 { animation: r1 8s ease-in-out infinite; }
  @keyframes r1 { 0%,10%,34%,100% { stroke-opacity: 0; } 16%,26% { stroke-opacity: .85; } }
  .r2 { animation: r2 8s ease-in-out infinite; }
  @keyframes r2 { 0%,20%,44%,100% { stroke-opacity: 0; } 26%,36% { stroke-opacity: .85; } }
  .r3 { animation: r3 8s ease-in-out infinite; }
  @keyframes r3 { 0%,31%,55%,100% { stroke-opacity: 0; } 37%,47% { stroke-opacity: .85; } }
  .r4 { animation: r4 8s ease-in-out infinite; }
  @keyframes r4 { 0%,45%,69%,100% { stroke-opacity: 0; } 51%,61% { stroke-opacity: .85; } }
  .r5 { animation: r5 8s ease-in-out infinite; }
  @keyframes r5 { 0%,55%,79%,100% { stroke-opacity: 0; } 61%,71% { stroke-opacity: .85; } }
  .r6 { animation: r6 8s ease-in-out infinite; }
  @keyframes r6 { 0%,64%,88%,100% { stroke-opacity: 0; } 70%,80% { stroke-opacity: .85; } }
  .r7 { animation: r7 8s ease-in-out infinite; }
  @keyframes r7 { 0%,74%,98%,100% { stroke-opacity: 0; } 80%,90% { stroke-opacity: .85; } }

  @media (prefers-reduced-motion: reduce) { .sig, .glow { animation: none !important; } }
</style>
<rect width="1200" height="540" rx="24" fill="url(#bg)"/>
<rect width="1200" height="540" rx="24" fill="url(#dots)"/>
<circle cx="120" cy="480" r="230" fill="url(#blobA)"/>
<circle cx="1100" cy="80" r="240" fill="url(#blobB)"/>

<text x="600" y="58" text-anchor="middle" font-size="26" font-weight="700" fill="url(#title)">从零到上线，跟着 7 步走</text>
