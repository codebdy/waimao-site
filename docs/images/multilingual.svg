<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-labelledby="t d">
<title id="t">多语言网站示意</title>
<desc id="d">一个外贸网站同时提供英语、西班牙语、德语、阿拉伯语等版本，每种语言有独立网址，页头可以切换语言，并告诉 Google 各语言版本的对应关系。</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8FBFF"/><stop offset="1" stop-color="#EEF3FF"/></linearGradient>
  <radialGradient id="blobA" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#67E8F9" stop-opacity=".40"/><stop offset="1" stop-color="#67E8F9" stop-opacity="0"/></radialGradient>
  <radialGradient id="blobB" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#A78BFA" stop-opacity=".35"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#14B8A6"/><stop offset=".5" stop-color="#3B82F6"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
  <linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0891B2"/><stop offset=".5" stop-color="#2563EB"/><stop offset="1" stop-color="#7C3AED"/></linearGradient>
  <filter id="shadow" x="-20%" y="-40%" width="140%" height="190%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="6"/><feOffset dy="4"/>
    <feComponentTransfer><feFuncA type="linear" slope=".13"/></feComponentTransfer>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#C7D2FE" opacity=".55"/></pattern>
</defs>
<style>
  text { font-family: 'PingFang SC','Microsoft YaHei','Noto Sans SC','Source Han Sans SC','Segoe UI','Noto Sans Arabic',sans-serif; }
  .base { fill: none; stroke-width: 2; opacity: .55; }
  .sig { fill: none; stroke-linecap: round; stroke-width: 4; stroke-dasharray: 14 120; stroke-dashoffset: 14; opacity: 0; }
  .glow { stroke-opacity: 0; }
  .m0 { animation: m0 6s ease-in-out infinite; }
  @keyframes m0 { 0%,8% { stroke-dashoffset: 14; opacity: 0; } 10% { opacity: 1; } 40% { stroke-dashoffset: -100; opacity: 1; } 42%,100% { stroke-dashoffset: -100; opacity: 0; } }
  .m1 { animation: m1 6s ease-in-out infinite; }
  @keyframes m1 { 0%,8% { stroke-dashoffset: 14; opacity: 0; } 10% { opacity: 1; } 40% { stroke-dashoffset: -100; opacity: 1; } 42%,100% { stroke-dashoffset: -100; opacity: 0; } }
  .m2 { animation: m2 6s ease-in-out infinite; }
  @keyframes m2 { 0%,8% { stroke-dashoffset: 14; opacity: 0; } 10% { opacity: 1; } 40% { stroke-dashoffset: -100; opacity: 1; } 42%,100% { stroke-dashoffset: -100; opacity: 0; } }
  .m3 { animation: m3 6s ease-in-out infinite; }
  @keyframes m3 { 0%,8% { stroke-dashoffset: 14; opacity: 0; } 10% { opacity: 1; } 40% { stroke-dashoffset: -100; opacity: 1; } 42%,100% { stroke-dashoffset: -100; opacity: 0; } }
  .h0 { animation: h0 6s ease-in-out infinite; }
  @keyframes h0 { 0%,40%,64%,100% { stroke-opacity: 0; } 46%,56% { stroke-opacity: .85; } }
  .h1 { animation: h1 6s ease-in-out infinite; }
  @keyframes h1 { 0%,40%,64%,100% { stroke-opacity: 0; } 46%,56% { stroke-opacity: .85; } }
  .h2 { animation: h2 6s ease-in-out infinite; }
  @keyframes h2 { 0%,40%,64%,100% { stroke-opacity: 0; } 46%,56% { stroke-opacity: .85; } }
  .h3 { animation: h3 6s ease-in-out infinite; }
  @keyframes h3 { 0%,40%,64%,100% { stroke-opacity: 0; } 46%,56% { stroke-opacity: .85; } }

  @media (prefers-reduced-motion: reduce) { .sig, .glow { animation: none !important; } }
</style>
<rect width="1200" height="470" rx="24" fill="url(#bg)"/>
<rect width="1200" height="470" rx="24" fill="url(#dots)"/>
<circle cx="120" cy="410" r="230" fill="url(#blobA)"/>
<circle cx="1100" cy="80" r="240" fill="url(#blobB)"/>

<text x="600" y="58" text-anchor="middle" font-size="26" font-weight="700" fill="url(#title)">一个网站，各国客户各看各的语言</text>
